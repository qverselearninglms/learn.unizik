name: Automated DigitalOcean Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create scripts directory on server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DO_SSH_HOST }}
        username: ${{ secrets.DO_SSH_USER }}
        key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        script: |
          mkdir -p /root/scripts/do
        
    - name: Upload deployment script
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.DO_SSH_HOST }}
        username: ${{ secrets.DO_SSH_USER }}
        key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        source: "scripts/do/deploy-to-do.sh"
        target: "/root/scripts/do"

    - name: Execute Deployment Script
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DO_SSH_HOST }}
        username: ${{ secrets.DO_SSH_USER }}
        key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        envs: LOCAL_VARIABLES
        script: |
          chmod +x /root/scripts/do/deploy-to-do.sh
          sudo /root/scripts/do/deploy-to-do.sh