name: Automated DigitalOcean Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    # NEXT_PUBLIC_* values are inlined into the JS bundle at build time,
    # so the env file must exist BEFORE `npm run build`.
    - name: Write env file for build
      env:
        LOCAL_VARIABLES: ${{ secrets.LOCAL_VARIABLES }}
      run: |
        if [ -z "$LOCAL_VARIABLES" ]; then
          echo "LOCAL_VARIABLES secret is empty; refusing to build without env."
          exit 1
        fi
        printf '%s\n' "$LOCAL_VARIABLES" > .env.production

    - name: Install dependencies and build standalone
      run: |
        npm ci
        npm run build

    - name: Verify API domain was baked into the build
      run: |
        API_DOMAIN="$(grep -E '^NEXT_PUBLIC_EXTERNAL_API_DOMAIN=' .env.production | tail -n1 | cut -d= -f2- | tr -d '"' | tr -d "'" | tr -d '\r')"
        if [ -z "$API_DOMAIN" ]; then
          echo "NEXT_PUBLIC_EXTERNAL_API_DOMAIN is missing from LOCAL_VARIABLES."
          exit 1
        fi
        if ! grep -rqF "$API_DOMAIN" .next/static .next/server; then
          echo "API domain '$API_DOMAIN' was not found in the build output."
          exit 1
        fi
        echo "API domain found in build output."

    - name: Prepare standalone artifact
      run: |
        mkdir -p standalone-artifact
        cp -a .next/standalone/. standalone-artifact/
        cp -r .next/static standalone-artifact/.next/
        test -f standalone-artifact/server.js
        test -f standalone-artifact/.next/BUILD_ID
        cp -r public standalone-artifact/ || true
        # Never ship env files inside the artifact; the server gets its own copy at deploy time.
        rm -f standalone-artifact/.env standalone-artifact/.env.* || true
        tar -czf standalone-artifact.tar.gz -C standalone-artifact .

    - name: Create deploy directories on server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DO_SSH_HOST }}
        username: ${{ secrets.DO_SSH_USER }}
        key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        script: |
          mkdir -p /root/scripts/do
          mkdir -p /tmp/standalone-deploy

    - name: Upload deployment script
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.DO_SSH_HOST }}
        username: ${{ secrets.DO_SSH_USER }}
        key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        source: "scripts/do/deploy-to-do.sh"
        target: "/root/scripts/do"
        strip_components: 2

    - name: Upload standalone artifact
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.DO_SSH_HOST }}
        username: ${{ secrets.DO_SSH_USER }}
        key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        source: "standalone-artifact.tar.gz"
        target: "/tmp/standalone-deploy"

    - name: Execute Deployment Script
      uses: appleboy/ssh-action@master
      env:
        LOCAL_VARIABLES: ${{ secrets.LOCAL_VARIABLES }}
      with:
        host: ${{ secrets.DO_SSH_HOST }}
        username: ${{ secrets.DO_SSH_USER }}
        key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        envs: LOCAL_VARIABLES
        command_timeout: 30m
        script: |
          if [ ! -f /root/scripts/do/deploy-to-do.sh ]; then
            echo "Deployment script not found at /root/scripts/do/deploy-to-do.sh"
            exit 1
          fi

          chmod +x /root/scripts/do/deploy-to-do.sh
          sudo --preserve-env=LOCAL_VARIABLES,ARTIFACT_PATH \
            ARTIFACT_PATH=/tmp/standalone-deploy/standalone-artifact.tar.gz \
            /root/scripts/do/deploy-to-do.sh

    - name: Verify application health
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DO_SSH_HOST }}
        username: ${{ secrets.DO_SSH_USER }}
        key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        command_timeout: 5m
        script: |
          set -e
          APP_HEALTH_URL="http://127.0.0.1:3600"

          echo "Waiting for app readiness at ${APP_HEALTH_URL} ..."
          for attempt in $(seq 1 20); do
            if curl -fsS "$APP_HEALTH_URL" >/dev/null; then
              echo "Health check passed on attempt ${attempt}."
              pm2 status gs.lean.unizik
              exit 0
            fi

            echo "Attempt ${attempt}/20 failed; retrying in 3s..."
            sleep 3
          done

          echo "Health check failed after 20 attempts."
          pm2 logs gs.lean.unizik --lines 80 --nostream || true
          exit 1
